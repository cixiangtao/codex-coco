extends: ./electron-builder.yml
artifactName: Codex-Coco-${version}-macOS-${arch}-self-signed.${ext}
forceCodeSigning: true
mac:
  identity: Codex Coco Update Signing
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  timestamp: none
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
publish: null
dmg:
  backgroundColor: "#F5F5EF"
  window:
    width: 540
    height: 460
  iconSize: 96
  contents:
    - x: 130
      y: 180
      type: file
    - x: 410
      y: 180
      type: link
      path: /Applications
    - x: 270
      y: 310
      type: file
      path: resources/INSTALL.txt
      name: Read Me First.txt
extraResources:
  - from: resources
    to: codex-coco
  - from: ../../LICENSE
    to: codex-coco/LICENSE.txt
  - from: ../../THIRD_PARTY_NOTICES.md
    to: codex-coco/THIRD_PARTY_NOTICES.md
  - from: ../../packages/ui/LICENSE.shadcn
    to: codex-coco/licenses/shadcn.txt
  - from: ../../work/release/THIRD_PARTY_LICENSES.txt
    to: codex-coco/THIRD_PARTY_LICENSES.txt
