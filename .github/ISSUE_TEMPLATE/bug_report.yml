name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities privately using SECURITY.md. Do not include account data, tokens, local configuration, or raw logs.
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit or app version, macOS version, chip architecture, and development or packaged build.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps and sanitized screenshots where useful.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
