name: Feature request
description: Describe a use case and proposed behavior
body:
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: What problem are you trying to solve, and why are the current options insufficient?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe concrete interactions and observable acceptance criteria.
    validations:
      required: true
