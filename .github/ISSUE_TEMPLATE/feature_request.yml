name: 功能建议
description: 描述使用场景和期望行为
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 目前遇到什么问题，现有操作为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 说明具体操作和可判断完成的结果。
    validations:
      required: true
